[project]
name = "care-link-development"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv.workspace]
members = ["packages/contracts/python", "services/core"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.14.3",
    "jsonschema[format]==4.25.1",
    "types-jsonschema==4.26.0.20261006",
]

[tool.pytest.ini_options]
testpaths = ["packages/contracts/python/tests", "services/core/tests", "tests"]
markers = ["unit: deterministic unit behavior", "contract: cross-language contract behavior"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
include = ["packages/**/*.py", "services/**/*.py", "tools/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101"]
"tests/**/*.py" = ["S101"]
