name: Foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON_DOWNLOADS: automatic
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Bootstrap pinned uv in a temporary environment
        run: |
          python3 -m venv "$RUNNER_TEMP/care-link-uv"
          "$RUNNER_TEMP/care-link-uv/bin/python" -m pip install uv==0.12.17
          echo "$RUNNER_TEMP/care-link-uv/bin" >> "$GITHUB_PATH"
      - run: uv python install 3.14.7
      - run: npm install --global pnpm@10.20.0 --ignore-scripts
      - run: uv sync --locked --all-packages --all-groups
      - run: pnpm install --frozen-lockfile
      - run: uv run --locked python tools/check.py
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build core with immutable image inputs
        run: python3 tools/build_core_image.py
      - name: Verify restricted nonroot image and contract behavior
        run: python3 tools/smoke_core_image.py
