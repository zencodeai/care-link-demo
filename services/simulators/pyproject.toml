[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "care-link-simulators"
version = "0.1.0"
description = "Isolated synthetic receiving-service simulator"
requires-python = ">=3.12,<3.15"
dependencies = ["care-link-contracts", "care-link-domain", "psycopg[binary]==3.2.12", "cryptography==50.0.2", "fastapi==0.162.2"]

[tool.uv.sources]
care-link-contracts = { workspace = true }
care-link-domain = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/care_link_simulators"]
