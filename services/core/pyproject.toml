[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "care-link-core"
version = "0.1.0"
description = "CARE-Link isolated developer API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "care-link-contracts",
  "care-link-domain", "care-link-knowledge",
  "httpx==0.28.1",
  "cryptography==50.0.2",
  "fastapi==0.162.2",
  "uvicorn==0.38.0",
]

[project.scripts]
care-link-core = "care_link_core.cli:main"

[tool.uv.sources]
care-link-knowledge = { workspace = true }
care-link-contracts = { workspace = true }
care-link-domain = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/care_link_core"]
