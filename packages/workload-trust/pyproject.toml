[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "care-link-workload-trust"
version = "0.1.0"
description = "CARE-Link protected Unix workload authorization and Envoy configuration"
requires-python = ">=3.14,<3.15"
dependencies = ["cryptography==50.0.2", "uvicorn==0.38.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/care_link_workload_trust"]
