[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "care-link-data"
version = "0.1.0"
description = "CARE-Link protected manual data gateway"
requires-python = ">=3.12,<3.15"
dependencies = ["care-link-contracts", "care-link-domain", "care-link-knowledge", "psycopg[binary]==3.2.12", "cryptography==50.0.2", "fastapi==0.162.2", "httpx==0.28.1"]

[tool.uv.sources]
care-link-knowledge = { workspace = true }
care-link-contracts = { workspace = true }
care-link-domain = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/care_link_data"]
