Specify OIDC/JWKS/login-intent/proof validation, explicit continuation recovery after lost response, workload attestation/mTLS/rotation/revocation and actual connection-policy enforcement. Define PEP/PDP inputs/results, metadata-only authorization bootstrap, exact actor/payload/revision binding, obligations, approved activation, current-state fencing and compromised-workload containment. Cover trust freshness/offline-help limits and deny-before-effect. Map OWASP/ATLAS and relevant governance references accurately without inventing control IDs or certification. Identify implementation choices that remain open instead of specifying a nonexistent mesh.
