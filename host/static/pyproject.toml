[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "care-link-static"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["care-link-contracts", "fastapi==0.162.2", "uvicorn==0.38.0", "cryptography==50.0.2"]

[project.scripts]
care-link-static = "care_link_static.cli:main"

[tool.uv.sources]
care-link-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/care_link_static"]
